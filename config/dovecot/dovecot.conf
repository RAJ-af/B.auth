listen = *
protocols = imap lmtp

# Log to stderr so `docker compose logs dovecot` captures auth failures.
log_path = /dev/stderr
info_log_path = /dev/stderr

mail_location = maildir:/var/mail/vhosts/%d/%n/Maildir
first_valid_uid = 5000
last_valid_uid = 5000
mail_uid = vmail
mail_gid = vmail

ssl = required
ssl_cert = </certs/server.crt
ssl_key = </certs/server.key
disable_plaintext_auth = yes

auth_mechanisms = xoauth2 oauthbearer

# OAuth2 token validation against Keycloak. On 2.3.x the oauth2 parameters are
# NOT dovecot.conf settings — they are read from the args file below, rendered
# at startup from 90-oauth2.conf.template (holds the introspection secret).
passdb {
  driver = oauth2
  mechanisms = xoauth2 oauthbearer
  args = /etc/dovecot/dovecot-oauth2.conf.ext
}

# Static vmail userdb (spec §5): every authenticated user maps to uid/gid 5000.
# allow_all_users=yes because existence is already enforced by the oauth2 passdb.
userdb static {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n allow_all_users=yes
}

# TCP listener for Postfix LMTP delivery (spec §5: postfix -> lmtp:dovecot:24).
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

!include_try /etc/dovecot/extra.conf

# Greylisting off (spec §3/§11: rspamd headers-only, nothing rejects or
# delays in MVP). actions.conf's "greylist = null" only removes the action
# threshold -- the greylist MODULE still issues its own 451 soft-reject
# ("Try again later"), which broke API submissions and would delay every
# fresh-body message. Disabling at module level is what actually turns it off.
enabled = false;

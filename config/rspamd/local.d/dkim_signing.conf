# DKIM signing policy (MVP). sign_networks MUST match COMPOSE_SUBNET in .env
# (static copy here: rspamd reads no compose env; acceptable at MVP, revisit if
# the subnet ever changes). Without it, compose-subnet submitters -- the API's
# :2587 path has no AUTH, so sign_authenticated never fires -- arrive unsigned.
sign_local = true;
sign_authenticated = true;
# Array form required: a bare string loads into the config but never matches
# (verified empirically -- loopback signed, subnet submissions stayed unsigned).
sign_networks = ["172.42.0.0/16"];
try_fallback = false;
domain {
  sovereign.mail {
    path = "/var/lib/rspamd/dkim/default.private.key";
    selector = "default";
  }
}

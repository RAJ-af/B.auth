services:
  cert-init:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/gen-certs.sh"]
    volumes:
      - ./scripts/gen-certs.sh:/gen-certs.sh:ro
      - certs:/certs
    restart: "no"
  openldap:
    restart: "unless-stopped"
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Sovereign
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_ADMIN_PASSWORD: ${LDAP_ROOT_PASSWORD}
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_data:/etc/ldap/slapd.d
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b '' -s base >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    restart: "unless-stopped"
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    restart: "unless-stopped"
    image: quay.io/keycloak/keycloak:26.0
    # --hostname pins the canonical frontend/issuer URL: tokens carry
    # iss=http://localhost:8080/realms/<realm>, and KC validates introspected tokens
    # against the REQUEST Host otherwise — container-side callers (dovecot) would see
    # {"active":false} for perfectly valid tokens (verified empirically, Task 4 spike).
    command: ["start-dev", "--import-realm", "--hostname", "http://localhost:${KEYCLOAK_PORT}"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/%s/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' '${KC_REALM}' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  dovecot:
    restart: "unless-stopped"
    build: mail/dovecot
    depends_on:
      keycloak: {condition: service_healthy}
      cert-init: {condition: service_completed_successfully}
    environment:
      KC_INTROSPECTION_SECRET: ${KC_INTROSPECTION_SECRET}
    volumes:
      - certs:/certs:ro
      - maildir_vmail:/var/mail/vhosts
      - ./config/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./config/dovecot/90-oauth2.conf.template:/templates/90-oauth2.conf.template:ro
    networks: [mailnet]
    ports:
      - "127.0.0.1:1143:143"
  postfix:
    restart: "unless-stopped"
    build: mail/postfix
    depends_on:
      rspamd: {condition: service_started}
      dovecot: {condition: service_started}
      cert-init: {condition: service_completed_successfully}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      COMPOSE_SUBNET: ${COMPOSE_SUBNET}
    volumes: [certs:/certs:ro]
    networks: [mailnet]
    ports:
      - "127.0.0.1:25:25"
  mailpit:
    restart: "unless-stopped"
    image: axllent/mailpit:v1.22
    networks: [mailnet]
    ports:
      - "127.0.0.1:8025:8025"
  api:
    restart: "unless-stopped"
    build: api
    depends_on:
      keycloak: {condition: service_healthy}
      dovecot: {condition: service_started}
      postfix: {condition: service_started}
      cert-init: {condition: service_completed_successfully}
    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      # Host-facing issuer base (matches keycloak's --hostname pin); see Ruling 5.
      KC_FRONTEND_URL: http://localhost:${KEYCLOAK_PORT}
      KC_REALM: ${KC_REALM}
      KC_APP_CLIENT: ${KC_APP_CLIENT}
      API_AUDIENCE: ${API_AUDIENCE}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SOVEREIGN_APP_DB: ${SOVEREIGN_APP_DB}
      LDAP_HOST: openldap
      LDAP_ADMIN_PASSWORD: ${LDAP_ROOT_PASSWORD}
      OTP_PROVIDER: ${OTP_PROVIDER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      OTP_CODE_TTL_SECONDS: ${OTP_CODE_TTL_SECONDS:-300}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_SENDS_PER_HOUR: ${OTP_MAX_SENDS_PER_HOUR:-3}
      OTP_MAX_VERIFY_ATTEMPTS: ${OTP_MAX_VERIFY_ATTEMPTS:-5}
      OTP_DAILY_CAP: ${OTP_DAILY_CAP:-200}
      IDVERIFY_MODE: ${IDVERIFY_MODE:-off}
      IDVERIFY_SCRIPT: ${IDVERIFY_SCRIPT:-/verify/mock-idverify.sh}
      IDVERIFY_TIMEOUT_SECONDS: ${IDVERIFY_TIMEOUT_SECONDS:-20}
      FAMILY_LINK_COOLDOWN_HOURS: ${FAMILY_LINK_COOLDOWN_HOURS:-48}
      RECOVERY_REQUEST_TTL_SECONDS: ${RECOVERY_REQUEST_TTL_SECONDS:-600}
      RECOVERY_MIN_DWELL_SECONDS: ${RECOVERY_MIN_DWELL_SECONDS:-600}
      RECOVERY_RESET_SESSION_TTL_SECONDS: ${RECOVERY_RESET_SESSION_TTL_SECONDS:-600}
      RECOVERY_MAX_ATTEMPTS_PER_HOUR: ${RECOVERY_MAX_ATTEMPTS_PER_HOUR:-3}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      SOVEREIGN_ADMIN_USER: ${SOVEREIGN_ADMIN_USER}
    volumes:
      - certs:/certs:ro
      - ./scripts/mock-idverify.sh:/verify/mock-idverify.sh:ro
    networks: [mailnet]
    ports:
      - "127.0.0.1:${API_PORT}:8000"
  redis:
    restart: "unless-stopped"
    image: redis:7-alpine
    networks: [mailnet]
  rspamd:
    restart: "unless-stopped"
    # healthcheck note: rspamd/rspamd:3.9 ships no nc/socat, and its proxy
    # worker rejects rspamc's HTTP POST on the milter socket ("HTTP POST
    # request is not supported in milter mode"), so the probe is a plain TCP
    # connect gate on 11332 via bash /dev/tcp.
    image: rspamd/rspamd:3.9
    hostname: rspamd
    # sign_networks templating: the image pins USER=_rspamd(11333) which cannot
    # write under /etc/rspamd, so the entrypoint wrapper runs as root, renders
    # the template into override.d (loaded after local.d) from COMPOSE_SUBNET /
    # MAIL_DOMAIN -- the same env postfix renders main.cf from -- and drops back
    # to 11333 before exec'ing rspamd. The subnet can no longer diverge from
    # .env structurally; smoke step 1b asserts the live dump matches .env.
    user: "0:0"
    entrypoint: ["/usr/local/bin/render-dkim-signing.sh"]
    command: ["/usr/bin/rspamd", "-f"]
    environment:
      COMPOSE_SUBNET: ${COMPOSE_SUBNET}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
    volumes:
      - rspamd_data:/var/lib/rspamd
      - dkim_keys:/var/lib/rspamd/dkim
      - ./config/rspamd/local.d:/etc/rspamd/local.d:ro
      - ./config/rspamd/dkim_signing.conf.template:/templates/dkim_signing.conf.template:ro
      - ./scripts/render-dkim-signing.sh:/usr/local/bin/render-dkim-signing.sh:ro
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/11332'"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  mailnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET}
volumes:
  pg_data: {}
  ldap_data: {}
  maildir_vmail: {}
  rspamd_data: {}
  dkim_keys: {}
  certs: {}

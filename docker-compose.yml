services:
  cert-init:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/gen-certs.sh"]
    volumes:
      - ./scripts/gen-certs.sh:/gen-certs.sh:ro
      - certs:/certs
    restart: "no"
networks:
  mailnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET}
volumes:
  pg_data: {}
  ldap_data: {}
  maildir_vmail: {}
  rspamd_data: {}
  dkim_keys: {}
  certs: {}
